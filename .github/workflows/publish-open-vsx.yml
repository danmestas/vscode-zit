name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Promote existing VSIX
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24


      - name: Derive release artifact names
        id: contract
        run: npm run release:contract

      - name: Validate requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm run release:assert-tag -- "$RELEASE_TAG"

      - name: Install locked dependencies
        run: npm ci

      - name: Download immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VSIX: ${{ steps.contract.outputs.vsix }}
          CHECKSUM: ${{ steps.contract.outputs.checksum }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern "$VSIX" \
            --pattern "$CHECKSUM"

      - name: Verify downloaded VSIX bytes
        run: npm run release:verify -- "dist/${{ steps.contract.outputs.vsix }}"

      - name: Publish existing VSIX to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: >-
          ./node_modules/.bin/ovsx publish
          "dist/${{ steps.contract.outputs.vsix }}"
          -p "$OVSX_PAT"
