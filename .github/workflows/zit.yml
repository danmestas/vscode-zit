name: Zit

on:
  push:
    branches: [ "main" ]
    tags:
      - v*
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  main:
    name: Run Zit Tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      vsix: ${{ steps.package.outputs.vsix }}
      checksum: ${{ steps.package.outputs.checksum }}
      artifact: zit-${{ steps.package.outputs.version }}-vsix
    steps:
      - name: Checkout extension
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24

      - name: Install extension dependencies
        run: npm ci

      - name: Test release contract
        run: npm run release:test

      - name: Run ESLint
        run: npm run lint --
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif

      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

      - name: Bootstrap Zit 0.1.4
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/zit-bootstrap.tar.gz"
          curl -fsSL \
            https://fossil.craftdesign.group/zit/uv/releases/0.1.4/zit-0.1.4-linux-x86_64.tar.gz \
            -o "$archive"
          echo "dc12486461381062e7571988c55c315d84d5998dd2ac9a8356bf8ed808837690  $archive" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/zit-bootstrap"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/zit-bootstrap"
          "$RUNNER_TEMP/zit-bootstrap/zit" version
          "$RUNNER_TEMP/zit-bootstrap/zit" clone --once \
            https://fossil.craftdesign.group/zit \
            "$RUNNER_TEMP/zit-source"
          cd "$RUNNER_TEMP/zit-source"
          "$RUNNER_TEMP/zit-bootstrap/zit" open
          test -f build.zig

      - name: Set up Zig 0.16
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build current Zit trunk
        shell: bash
        run: |
          set -euxo pipefail
          zig version | grep -E '^0\.16\.'
          cd "$RUNNER_TEMP/zit-source"
          zig build --release=fast
          mkdir -p "$HOME/.local/bin"
          install -m 0755 zig-out/bin/zit "$HOME/.local/bin/zit"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Zit
        shell: bash
        run: |
          set -euo pipefail
          zit version | tee "$RUNNER_TEMP/zit-version.txt"
          grep -E '^zit [0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/zit-version.txt"

      - name: Run code tests and coverage
        run: xvfb-run -a npm run coverage-ci "$GITHUB_STEP_SUMMARY"

      - name: Run Pikchr grammar tests
        run: npm run grammar-test

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:assert-tag -- "$GITHUB_REF_NAME"

      - name: Package checksummed VSIX
        id: package
        run: |
          rm -rf out
          npm run release:package

      - name: Verify checksummed VSIX
        run: npm run release:verify -- "${{ steps.package.outputs.vsix_path }}"

      - name: Upload checksummed VSIX
        uses: actions/upload-artifact@v6
        with:
          name: zit-${{ steps.package.outputs.version }}-vsix
          path: |
            ${{ steps.package.outputs.vsix_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download checksummed VSIX
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.main.outputs.artifact }}
          path: dist

      - name: Verify downloaded artifact bytes
        working-directory: dist
        run: sha256sum --check "${{ needs.main.outputs.checksum }}"

      - name: Attach tested artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ needs.main.outputs.vsix }}
            dist/${{ needs.main.outputs.checksum }}
          fail_on_unmatched_files: true
